name: Published analysis checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python scripts/check_results.py
      - name: Ranking and terminal semantics tests
        working-directory: jepa-wms
        run: python -m unittest tests.test_candidate_analysis tests.test_wall_terminal tests.test_reach_wall_c tests.test_reach_wall_terminal -v
